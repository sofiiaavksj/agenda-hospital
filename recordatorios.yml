# Envía los recordatorios cada hora (necesario para respetar el rango horario
# que elige cada paciente). El plan gratuito de Vercel sólo permite una
# ejecución diaria; este flujo de GitHub Actions es gratuito.
# Requiere los secretos APP_URL y CRON_SECRET (Settings → Secrets and variables → Actions).
name: Recordatorios
on:
  schedule:
    - cron: "2 * * * *"   # minuto 2 de cada hora
  workflow_dispatch: {}
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar la tarea de recordatorios
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/recordatorios"
